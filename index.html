<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lifepilot</title>
  <meta name="description" content="A friendly daily planning app that turns messy tasks into a clear schedule.">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">
      <span class="route-mark">
        <i></i>
        <i></i>
        <i></i>
      </span>
      <span>
        <strong>lifepilot</strong>
        <small>Plan the day you actually have</small>
      </span>
    </a>
    <nav class="top-actions">
      <button id="sample-btn" type="button">Load sample</button>
      <button id="copy-btn" type="button">Copy plan</button>
      <button id="json-btn" type="button">Export JSON</button>
    </nav>
  </header>

  <main class="shell">
    <section class="planner">
      <aside class="input-panel">
        <div class="panel-title">
          <p>Start here</p>
          <h1>Drop the messy list. Get a clear day.</h1>
        </div>

        <label class="field">
          <span>Brain dump</span>
          <textarea id="task-input" rows="13" spellcheck="false"></textarea>
        </label>

        <div class="controls">
          <label class="field">
            <span>Day starts</span>
            <input id="start-time" type="time" value="08:00">
          </label>
          <label class="field">
            <span>Day ends</span>
            <input id="end-time" type="time" value="22:30">
          </label>
          <label class="field">
            <span>Mode</span>
            <select id="mode-select">
              <option value="balanced">Balanced</option>
              <option value="student">Student</option>
              <option value="career">Career</option>
              <option value="light">Light day</option>
            </select>
          </label>
          <label class="field">
            <span>Break rhythm</span>
            <select id="break-select">
              <option value="normal">Normal</option>
              <option value="deep">Deep focus</option>
              <option value="gentle">Gentle</option>
            </select>
          </label>
        </div>

        <button class="primary" id="plan-btn" type="button">Build my plan</button>
      </aside>

      <section class="result-panel">
        <div class="today-strip">
          <div>
            <span>Today plan</span>
            <strong id="plan-date">Ready</strong>
          </div>
          <div class="score-card">
            <span>Load</span>
            <strong id="load-score">--</strong>
          </div>
          <div class="score-card">
            <span>Focus blocks</span>
            <strong id="focus-count">--</strong>
          </div>
          <div class="score-card">
            <span>Free time</span>
            <strong id="free-time">--</strong>
          </div>
        </div>

        <div class="brief" id="brief">
          Type a few things you need to do, then build a plan.
        </div>

        <div class="columns">
          <section class="timeline-panel">
            <div class="section-head">
              <h2>Timeline</h2>
              <span id="timeline-count">0 blocks</span>
            </div>
            <div id="timeline" class="timeline"></div>
          </section>

          <section class="insights-panel">
            <div class="section-head">
              <h2>Tasks</h2>
              <span id="task-count">0 items</span>
            </div>
            <div id="task-list" class="task-list"></div>
            <div class="section-head second">
              <h2>Suggestions</h2>
              <span id="suggestion-count">0 notes</span>
            </div>
            <div id="suggestions" class="suggestions"></div>
          </section>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="src/planner.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
